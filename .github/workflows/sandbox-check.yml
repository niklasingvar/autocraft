name: Sandbox check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTOCRAFT_DB: ${{ runner.temp }}/autocraft-sandbox-test.db
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
      - run: npm install --global pnpm@11.28.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node --test test/sandbox.test.ts
